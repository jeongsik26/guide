plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.guide'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    queryDslVersion = '7.7'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 / 뷰
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 웹소켓(STOMP)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JPA / DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    developmentOnly 'org.springframework.boot:spring-boot-h2console'

    // QueryDSL (jakarta 지원 OpenFeign 포크)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 비밀번호 해시(BCrypt)
    implementation 'org.springframework.security:spring-security-crypto'

    // model mapper
    implementation 'org.modelmapper:modelmapper:3.2.8'

    // Swagger UI (springfox 대체)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

// 실행용 jar(bootJar)만 만들고 -plain.jar 는 만들지 않음
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

// bootRun 중 템플릿/정적 파일 수정이 바로 반영되도록 src 리소스를 직접 사용
tasks.named('bootRun') {
    sourceResources sourceSets.main
}
