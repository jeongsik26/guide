<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 공통 헤더: th:replace="~{include/header :: header('home' | 'community' | 'chat' | '')}" -->
<header class="site-header" th:fragment="header(menu)">
    <div class="inner">
        <a class="logo" th:href="@{/main}">
            <img th:src="@{/image/logo.png}" alt="TRAVELMAKER">
        </a>
        <nav class="gnb">
            <a th:href="@{/main}" th:classappend="${menu == 'home'} ? 'active'">홈</a>
            <a th:href="@{/post/joinMain}" th:classappend="${menu == 'community'} ? 'active'">커뮤니티</a>
            <a th:href="@{/chat/chatList}" th:classappend="${menu == 'chat'} ? 'active'">채팅</a>
        </nav>
        <div class="util" th:if="${session.member_id != null}">
            <a th:href="@{/member/myPage}">마이페이지</a>
            <form th:action="@{/member/logout}" method="post">
                <button type="submit">로그아웃</button>
            </form>
        </div>
        <div class="util" th:unless="${session.member_id != null}">
            <a th:href="@{/member/login}">로그인</a>
            <a class="btn btn-primary btn-sm signup" th:href="@{/member/signUp}">회원가입</a>
        </div>
    </div>
</header>
</body>
</html>
