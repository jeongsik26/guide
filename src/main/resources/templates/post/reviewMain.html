<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>여행 후기 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/post/board.css}">
</head>
<body>
<header th:replace="~{include/header :: header('community')}"></header>

<main class="page board"
      th:with="searching=${param.searchValue != null},
               listUrl=${searching} ? '/post/reviewMain/search' : '/post/reviewMain'">
    <div class="board-head">
        <div>
            <h1>여행 후기</h1>
            <p class="desc">다녀온 여행 이야기를 나눠 주세요.</p>
        </div>
        <a class="btn btn-dark" th:href="@{/post/reviewWrite}">글쓰기</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <nav class="tabs board-tabs">
        <a th:href="@{/post/joinMain}" th:classappend="${'Review' == 'Join'} ? 'active'">동행 모집</a>
        <a th:href="@{/post/reviewMain}" th:classappend="${'Review' == 'Review'} ? 'active'">여행 후기</a>
        <a th:href="@{/post/carrotMain}" th:classappend="${'Review' == 'Carrot'} ? 'active'">중고 거래</a>
    </nav>

    <div class="board-toolbar">
        <div class="sort">
            <a th:href="@{/post/reviewMain}" th:classappend="${sort == 'registerDate'} ? 'active'">최신순</a>
            <a th:href="@{/post/reviewMain/view}" th:classappend="${sort == 'views'} ? 'active'">조회순</a>
            <a th:href="@{/post/reviewMain/comments}" th:classappend="${sort == 'comments'} ? 'active'">댓글순</a>
        </div>
        <form class="search" th:action="@{/post/reviewMain/search}" method="get">
            <input type="hidden" name="postType" value="Review">
            <input class="input" type="search" name="searchValue" th:value="${param.searchValue}"
                   placeholder="제목, 내용, 작성자 검색">
            <button type="submit" aria-label="검색">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
        </form>
    </div>

    <p class="search-result" th:if="${searching}">
        '<strong th:text="${param.searchValue}"></strong>' 검색 결과 <span th:text="${posts.totalElements}">0</span>건
        <a th:href="@{/post/reviewMain}">전체 보기</a>
    </p>

    <div class="empty" th:if="${posts.isEmpty()}">
        <p>아직 게시글이 없어요.</p>
        <a class="btn btn-primary btn-sm" th:href="@{/post/reviewWrite}">첫 글 쓰기</a>
    </div>

    <section class="post-grid" th:unless="${posts.isEmpty()}">
        <a class="post-card" th:each="post : ${posts.content}"
           th:href="@{/post/reviewDetail(postId=${post.postId})}">
            <div class="thumb">
                <img th:if="${post.imageDTOs != null && !post.imageDTOs.isEmpty()}"
                     th:src="@{'/api/photo/' + ${post.imageDTOs[0].uuid} + '_' + ${post.imageDTOs[0].fileName}}"
                     th:attr="onerror=|this.parentNode.classList.add('no-image');this.remove()|"
                     alt="" loading="lazy">
                <span class="placeholder" th:if="${post.imageDTOs == null || post.imageDTOs.isEmpty()}">✈️</span>
                <span class="placeholder fallback">✈️</span>
            </div>
            <div class="body">
                <div class="tags">
                    <span class="stars" th:text="${#strings.repeat('★', post.grade)} + ${#strings.repeat('☆', 5 - post.grade)}">★★★★★</span>
                </div>
                <h3 class="title" th:text="${post.title}">제목</h3>
                <div class="meta">
                    <span th:text="${#temporals.format(post.registerDate, 'yyyy.MM.dd')}">2026.01.01</span>
                    <span>조회 [[${post.views}]]</span>
                    <span>댓글 [[${post.commentCount}]]</span>
                </div>
            </div>
        </a>
    </section>

    <nav class="pagination" th:if="${posts.totalPages > 1}">
        <a th:if="${posts.hasPrevious()}" aria-label="이전"
           th:href="@{${listUrl}(page=${posts.number}, sort=${sort}, searchValue=${param.searchValue}, postType=${searching} ? 'Review' : null)}">‹</a>
        <a th:each="i : ${#numbers.sequence(1, posts.totalPages)}" th:text="${i}"
           th:classappend="${posts.number + 1 == i} ? 'active'"
           th:href="@{${listUrl}(page=${i}, sort=${sort}, searchValue=${param.searchValue}, postType=${searching} ? 'Review' : null)}">1</a>
        <a th:if="${posts.hasNext()}" aria-label="다음"
           th:href="@{${listUrl}(page=${posts.number + 2}, sort=${sort}, searchValue=${param.searchValue}, postType=${searching} ? 'Review' : null)}">›</a>
    </nav>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>
</body>
</html>
