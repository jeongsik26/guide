<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>동행 모집 글쓰기 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/post/write.css}">
</head>
<body>
<header th:replace="~{include/header :: header('community')}"></header>

<main class="page page-medium write">
    <div class="page-title">
        <h1>동행 모집 글쓰기</h1>
        <p>함께 떠날 여행 메이트를 모집해 보세요.</p>
    </div>

    <form class="card card-body write-form" th:action="@{/post/joinWrite}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="postType" value="Join">

        <div class="field">
            <label for="title">제목</label>
            <input class="input" id="title" name="title" type="text" required maxlength="100" placeholder="제목을 입력하세요">
        </div>
        <div class="field-row">
            <div class="field">
                <label for="numPeople">모집 인원</label>
                <input class="input" id="numPeople" name="numPeople" type="number" min="1" placeholder="예) 3">
            </div>
            <div class="field">
                <label for="expense">예상 경비(원)</label>
                <input class="input" id="expense" name="expense" type="number" min="0" placeholder="예) 300000">
            </div>
        </div>
        <div class="field">
            <span class="label">여행 기간</span>
            <div class="field-row">
                <input class="input" type="date" id="startTravelDate" name="startTravelDate" aria-label="시작일">
                <input class="input" type="date" id="endTravelDate" name="endTravelDate" aria-label="종료일">
            </div>
        </div>
        <div class="field">
            <label for="content">내용</label>
            <textarea class="textarea" id="content" name="content" required placeholder="일정, 원하는 동행 스타일 등을 자유롭게 적어 주세요."></textarea>
        </div>

        <div class="field">
            <span class="label">사진</span>
            <label class="upload" for="select">
                <img id="profile-image" th:src="@{/image/camera.png}" alt="">
                <span class="upload-text">클릭해서 사진 추가 <small>(선택, 10MB 이하)</small></span>
            </label>
            <input id="select" type="file" name="file" accept="image/*" onchange="handleImageUpload(event)" hidden>
        </div>

        <div class="field">
            <label for="sample6_address">여행지</label>
            <div class="field-row">
                <input class="input" type="text" id="sample6_address" placeholder="주소 검색 버튼을 눌러 주세요" readonly>
                <button class="btn btn-outline" type="button" onclick="sample6_execDaumPostcode()">주소 검색</button>
            </div>
            <input type="hidden" name="locationX" id="sample6_latitude" value="">
            <input type="hidden" name="locationY" id="sample6_longitude" value="">
            <div id="map" class="map"></div>
        </div>

        <div class="form-actions">
            <a class="btn btn-ghost" th:href="@{/post/joinMain}">취소</a>
            <button type="submit" class="btn btn-primary">등록하기</button>
        </div>
    </form>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script th:src="@{/js/post/write.js}"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f982e13e4f6fb5fa544e2ca4883ced76&libraries=services"></script>
<script th:src="@{/js/post/mapFindLoc.js}"></script>
</body>
</html>
