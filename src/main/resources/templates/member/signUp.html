<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>회원가입 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/member/member.css}">
</head>
<body>
<header th:replace="~{include/header :: header('')}"></header>

<main class="page page-narrow auth">
    <div class="auth-head">
        <h1>회원가입</h1>
        <p>간단한 정보만 입력하면 바로 시작할 수 있어요.</p>
    </div>

    <div class="alert alert-error" th:if="${param.error != null}">이미 사용 중인 아이디입니다.</div>

    <form class="card card-body" th:action="@{/member/signUp}" method="post" onsubmit="return signUpForm()">
        <div class="field">
            <label for="name">이름</label>
            <input class="input" type="text" id="name" name="name" maxlength="100" placeholder="이름">
        </div>
        <div class="field">
            <label for="id">아이디</label>
            <div class="field-row">
                <input class="input" type="text" id="id" name="uid" maxlength="100" autocomplete="username" placeholder="아이디">
                <button type="button" class="btn btn-outline" id="duplicate" onclick="checkDuplicateId()">중복확인</button>
            </div>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" type="password" id="password" name="pwd" autocomplete="new-password" placeholder="비밀번호">
        </div>
        <div class="field">
            <label for="check">비밀번호 확인</label>
            <input class="input" type="password" id="check" name="check" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요">
        </div>
        <div class="field">
            <label for="phone1">휴대폰 번호</label>
            <div class="phone-row">
                <select class="select" id="phone1" aria-label="휴대폰 앞자리">
                    <option value="010" selected>010</option>
                    <option value="011">011</option>
                    <option value="016">016</option>
                    <option value="017">017</option>
                    <option value="018">018</option>
                    <option value="019">019</option>
                </select>
                <span class="dash">-</span>
                <input class="input" type="tel" id="phone2" inputmode="numeric" maxlength="4" placeholder="1234" aria-label="휴대폰 가운데 자리">
                <span class="dash">-</span>
                <input class="input" type="tel" id="phone3" inputmode="numeric" maxlength="4" placeholder="5678" aria-label="휴대폰 끝자리">
            </div>
            <!-- 세 칸을 합친 값(01012345678)을 서버로 보낸다 -->
            <input type="hidden" id="phone" name="phone">
        </div>
        <div class="field-row">
            <div class="field"
                 th:with="thisYear=${#temporals.year(#temporals.createNow())}">
                <label for="year">출생 연도</label>
                <select class="select" id="year" name="year">
                    <option value="" selected disabled>연도 선택</option>
                    <option th:each="y : ${#numbers.sequence(thisYear - 14, thisYear - 100, -1)}"
                            th:value="${y}" th:text="|${y}년|">2000년</option>
                </select>
            </div>
            <div class="field">
                <span class="label">성별</span>
                <div class="segmented">
                    <input type="radio" id="male" name="gender" value="male"><label for="male">남자</label>
                    <input type="radio" id="female" name="gender" value="female"><label for="female">여자</label>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit" id="finishBtn">가입하기</button>
    </form>

    <p class="auth-switch">이미 계정이 있으신가요? <a th:href="@{/member/login}">로그인</a></p>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script th:src="@{/js/member/signUp.js}"></script>
</body>
</html>
