<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>프로필 수정 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/member/member.css}">
</head>
<body>
<header th:replace="~{include/header :: header('')}"></header>

<main class="page page-medium profile-edit">
    <div class="page-title">
        <h1>프로필 수정</h1>
        <p>바꾸고 싶은 항목만 수정하세요. 사진을 선택하지 않으면 기존 사진을 그대로 사용해요.</p>
    </div>

    <form class="card card-body" th:action="@{/member/profile}" method="post" enctype="multipart/form-data"
          onsubmit="return checkTravelType()">
        <div class="photo-field">
            <label class="photo" for="file">
                <img id="previewImage" th:src="${member != null and member.profileInfo != null} ? @{'/api/photo/' + ${member.profileInfo.uuid + '_' + member.profileInfo.fileName}} : @{/image/pf_example.svg}" alt="프로필 사진">
                <span class="photo-edit">변경</span>
            </label>
            <input type="file" id="file" name="file" accept="image/*" hidden>
            <p class="hint">사진을 눌러 프로필 사진을 선택하세요.</p>
        </div>

        <div class="field">
            <label for="content">한줄 소개</label>
            <input class="input" type="text" id="content" name="content" maxlength="100" th:value="${member != null and member.profileInfo != null} ? ${member.profileInfo.content} : ''"
                   placeholder="예) 바다를 좋아하는 계획형 여행자입니다">
        </div>

        <div class="field">
            <span class="label">나의 여행 유형</span>
            <p class="hint">각 줄에서 나와 더 가까운 쪽을 골라 주세요.</p>
            <div class="select">
                <button type="button" class="selectBtn" id="E" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 0, 1) == 'E'} ? 'selected'">사람 많은 도시파</button>
                <button type="button" class="selectBtn" id="I" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 0, 1) == 'I'} ? 'selected'">나무 많은 자연파</button>
            </div>
            <div class="select">
                <button type="button" class="selectBtn" id="S" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 1, 2) == 'S'} ? 'selected'">정해진 코스파</button>
                <button type="button" class="selectBtn" id="N" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 1, 2) == 'N'} ? 'selected'">상상대로 모험파</button>
            </div>
            <div class="select">
                <button type="button" class="selectBtn" id="F" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 2, 3) == 'F'} ? 'selected'">감성파</button>
                <button type="button" class="selectBtn" id="T" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 2, 3) == 'T'} ? 'selected'">효율파</button>
            </div>
            <div class="select">
                <button type="button" class="selectBtn" id="J" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 3, 4) == 'J'} ? 'selected'">꼼꼼한 계획파</button>
                <button type="button" class="selectBtn" id="P" th:classappend="${member != null and member.profileInfo != null and #strings.length(member.profileInfo.travelType) == 4 and #strings.substring(member.profileInfo.travelType, 3, 4) == 'P'} ? 'selected'">끌리는대로 행동파</button>
            </div>
            <input type="hidden" id="mbtiResult" name="travelType" th:value="${member != null and member.profileInfo != null} ? ${member.profileInfo.travelType} : ''">
        </div>

        <div class="form-actions">
            <a class="btn btn-ghost" th:href="@{/}">취소</a>
            <button type="submit" class="btn btn-primary">저장하기</button>
        </div>
    </form>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>

<script th:src="@{/js/member/mbti.js}"></script>
<script>
    // 사진 미리보기
    document.getElementById('file').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) { document.getElementById('previewImage').src = e.target.result; };
        reader.readAsDataURL(file);
    });

    function checkTravelType() {
        if (document.getElementById('mbtiResult').value.length !== 4) {
            alert('여행 유형을 네 줄 모두 선택해 주세요.');
            return false;
        }
        return true;
    }
</script>
</body>
</html>
