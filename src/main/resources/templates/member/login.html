<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>로그인 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/member/member.css}">
    <script th:src="@{/js/member/login.js}"></script>
</head>
<body>
<header th:replace="~{include/header :: header('')}"></header>

<main class="page page-narrow auth">
    <div class="auth-head">
        <h1>로그인</h1>
        <p>함께 여행을 떠날 사람들을 만나 보세요.</p>
    </div>

    <div class="alert alert-error" th:if="${param.error != null}">아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <form class="card card-body" th:action="@{/member/login}" method="post" onsubmit="return validateForm()">
        <div class="field">
            <label for="id">아이디</label>
            <input class="input" type="text" id="id" name="uid" autocomplete="username" placeholder="아이디를 입력하세요">
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" type="password" id="password" name="pwd" autocomplete="current-password" placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없으신가요? <a th:href="@{/member/signUp}">회원가입</a></p>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>
</body>
</html>
