<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title th:text="${member.name} + '님의 프로필 · TRAVELMAKER'">마이페이지 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/member/member.css}">
</head>
<body>
<header th:replace="~{include/header :: header('')}"></header>

<main class="page mypage" th:with="profile=${member.profileInfo}">
    <div class="mypage-grid">
        <aside class="card profile-card">
            <img class="avatar avatar-xl"
                 th:src="${profile != null} ? @{'/api/photo/' + ${profile.uuid + '_' + profile.fileName}} : @{/image/user.svg}"
                 th:attr="onerror=|this.src='@{/image/user.svg}'|" alt="프로필 사진">
            <h1 class="name" th:text="${member.name}">이름</h1>
            <p class="sub">[[${member.ageRange}]] · [[${member.genderDescription}]]</p>
            <span class="badge" th:if="${profile != null}" th:text="${profile.travelType}">ENFP</span>
            <p class="intro" th:if="${profile != null and !#strings.isEmpty(profile.content)}" th:text="${profile.content}">한줄 소개</p>

            <div class="stats">
                <div><strong th:text="${member.postCount}">0</strong><span>게시글</span></div>
                <div><strong th:text="${member.commentCount}">0</strong><span>댓글</span></div>
            </div>

            <button type="button" class="btn btn-primary btn-block" id="startChat">1:1 채팅하기</button>
        </aside>

        <div class="mypage-main">
            <section class="card card-body">
                <h2>여행 유형</h2>
                <div class="type-grid" th:if="${profile != null and #strings.length(profile.travelType) == 4}">
                    <div class="type-chip c1" th:text="${#strings.startsWith(profile.travelType, 'E')} ? '사람 많은 도시파' : '나무 많은 자연파'">도시파</div>
                    <div class="type-chip c2" th:text="${#strings.contains(profile.travelType, 'S')} ? '정해진 코스파' : '상상대로 모험파'">코스파</div>
                    <div class="type-chip c3" th:text="${#strings.contains(profile.travelType, 'F')} ? '감성파' : '효율파'">감성파</div>
                    <div class="type-chip c4" th:text="${#strings.contains(profile.travelType, 'J')} ? '꼼꼼한 계획파' : '끌리는대로 행동파'">계획파</div>
                </div>
                <p class="muted" th:unless="${profile != null and #strings.length(profile.travelType) == 4}">아직 등록된 여행 유형이 없어요.</p>
            </section>

            <section class="card card-body">
                <h2>최근 작성한 글</h2>
                <ul class="post-list" th:if="${not #lists.isEmpty(member.posts)}">
                    <li th:each="post : ${member.posts}">
                        <a th:with="key=${post.postType == 'Join'} ? 'join' : (${post.postType == 'Review'} ? 'review' : 'carrot')"
                           th:href="@{'/post/' + ${key} + 'Detail'(postId=${post.postId})}">
                            <span class="badge badge-gray"
                                  th:text="${post.postType == 'Join'} ? '동행' : (${post.postType == 'Review'} ? '후기' : '거래')">동행</span>
                            <span class="title" th:text="${post.title}">제목</span>
                            <span class="date" th:text="${#temporals.format(post.registerDate, 'yyyy.MM.dd')}">2026.01.01</span>
                        </a>
                    </li>
                </ul>
                <p class="muted" th:if="${#lists.isEmpty(member.posts)}">등록한 게시글이 없어요.</p>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>

<script th:inline="javascript">
    const senderId = /*[[${senderId}]]*/ null;     // 로그인한 사용자
    const receiverId = /*[[${receiverId}]]*/ null; // 보고 있는 회원

    document.getElementById('startChat').addEventListener('click', function () {
        if (senderId == null) {
            window.location.href = '/member/login';
            return;
        }
        fetch(`/api/chat/create?receiverId=${receiverId}`, {method: 'POST'})
            .then(response => response.json().then(data => ({ok: response.ok, data})))
            .then(({ok, data}) => {
                if (!ok) {
                    alert(data.message || '채팅방을 만들지 못했습니다.');
                    return;
                }
                window.location.href = `/chat/chatRoom/${data.roomId}`;
            })
            .catch(error => console.error('Error:', error));
    });
</script>
</body>
</html>
