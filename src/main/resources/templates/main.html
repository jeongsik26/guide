<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{include/header :: header('home')}"></header>

<main class="page home">
    <!-- 배너: 두 장을 번갈아 보여준다 -->
    <section class="hero">
        <img class="hero-img is-active" th:src="@{/image/main.png}" alt="세상을 만나는 새로운 방법, 함께 여행을 떠나는 커뮤니티">
        <img class="hero-img" th:src="@{/image/main_pic.png}" alt="">
        <div class="hero-dots">
            <button type="button" class="is-active" aria-label="첫 번째 배너"></button>
            <button type="button" aria-label="두 번째 배너"></button>
        </div>
    </section>

    <section class="home-grid">
        <a class="menu-card join" th:href="@{/post/joinMain}">
            <img th:src="@{/image/joinBtn.png}" alt="">
            <div class="menu-text">
                <strong>동행 모집</strong>
                <span>함께 떠날 여행 메이트 찾기</span>
            </div>
        </a>
        <a class="menu-card carrot" th:href="@{/post/carrotMain}">
            <img th:src="@{/image/carrotBtn.png}" alt="">
            <div class="menu-text">
                <strong>중고 거래</strong>
                <span>여행 용품 사고팔기</span>
            </div>
        </a>

        <div class="side">
            <!-- 내 정보 -->
            <div class="card user-card">
                <th:block th:if="${session.member_id != null and member_info != null}">
                    <img class="avatar avatar-lg"
                         th:if="${member_info.profileInfo != null}"
                         th:src="@{'/api/photo/' + ${member_info.profileInfo.uuid + '_' + member_info.profileInfo.fileName}}"
                         alt="내 프로필 사진">
                    <img class="avatar avatar-lg" th:unless="${member_info.profileInfo != null}"
                         th:src="@{/image/pf_example.png}" alt="">
                    <div class="user-text">
                        <p class="greeting">안녕하세요 👋</p>
                        <p class="name">
                            <strong th:text="${member_info.name}">여행자</strong>님
                            <span class="badge" th:if="${member_info.profileInfo != null}"
                                  th:text="${member_info.profileInfo.travelType}">ENFP</span>
                        </p>
                        <div class="actions">
                            <a class="btn btn-primary btn-sm" th:if="${member_info.profileInfo != null}" th:href="@{/member/myPage}">마이페이지</a>
                            <a class="btn btn-primary btn-sm" th:unless="${member_info.profileInfo != null}" th:href="@{/member/profile}">프로필 등록</a>
                            <form th:action="@{/member/logout}" method="post">
                                <button type="submit" class="btn btn-ghost btn-sm">로그아웃</button>
                            </form>
                        </div>
                    </div>
                </th:block>
                <th:block th:unless="${session.member_id != null and member_info != null}">
                    <img class="avatar avatar-lg" th:src="@{/image/pf_example.png}" alt="">
                    <div class="user-text">
                        <p class="greeting">안녕하세요 여행자님 👋</p>
                        <p class="sub">로그인하고 여행 메이트를 찾아보세요</p>
                        <div class="actions">
                            <a class="btn btn-primary btn-sm" th:href="@{/member/login}">로그인</a>
                            <a class="btn btn-outline btn-sm" th:href="@{/member/signUp}">회원가입</a>
                        </div>
                    </div>
                </th:block>
            </div>

            <!-- 여행자 목록 -->
            <div class="card travelers">
                <div class="travelers-head">
                    <h3>TRAVELMAKER 여행자들</h3>
                    <span class="count" th:text="${#lists.size(otherMembers)} + '명'">0명</span>
                </div>
                <!-- 자동으로 왼쪽으로 흐르는 목록 (마우스를 올리면 멈춤) -->
                <div class="traveler-list" id="travelerList" th:if="${not #lists.isEmpty(otherMembers)}">
                    <div class="traveler-track" id="travelerTrack">
                        <a class="traveler" th:each="m : ${otherMembers}"
                           th:href="@{/member/otherPage/{id}(id=${m.memberId})}">
                            <img class="avatar"
                                 th:src="@{'/api/photo/' + ${m.profileInfo.uuid + '_' + m.profileInfo.fileName}}"
                                 th:attr="onerror=|this.src='@{/image/pf_example.png}'|" alt="">
                            <span class="name" th:text="${m.name}">이름</span>
                            <span class="meta" th:text="|${m.ageRange} · ${m.profileInfo.travelType}|">20대 · ENFP</span>
                        </a>
                    </div>
                </div>
                <p class="empty-text" th:if="${#lists.isEmpty(otherMembers)}">아직 프로필을 등록한 여행자가 없어요.</p>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>

<script>
    // 배너 자동 전환(5초)과 점 버튼
    (function () {
        var images = document.querySelectorAll('.hero-img');
        var dots = document.querySelectorAll('.hero-dots button');
        var current = 0;

        function show(index) {
            images[current].classList.remove('is-active');
            dots[current].classList.remove('is-active');
            current = index;
            images[current].classList.add('is-active');
            dots[current].classList.add('is-active');
        }

        dots.forEach(function (dot, index) {
            dot.addEventListener('click', function () { show(index); });
        });
        setInterval(function () { show((current + 1) % images.length); }, 5000);
    })();

    // 여행자 목록 자동 흐름: 한 줄에 다 안 들어갈 때만 목록을 한 벌 더 붙여 끊김 없이 반복
    (function () {
        var list = document.getElementById('travelerList');
        var track = document.getElementById('travelerTrack');
        if (!list || !track) return;

        function setup() {
            track.classList.remove('is-marquee');
            track.querySelectorAll('[data-clone]').forEach(function (el) { el.remove(); });
            if (track.scrollWidth <= list.clientWidth) return;

            Array.prototype.slice.call(track.children).forEach(function (item) {
                var clone = item.cloneNode(true);
                clone.setAttribute('data-clone', '');
                clone.setAttribute('aria-hidden', 'true');
                clone.setAttribute('tabindex', '-1');
                track.appendChild(clone);
            });
            // 한 명당 약 2초 속도
            track.style.setProperty('--marquee-duration', (track.children.length / 2) * 2 + 's');
            track.classList.add('is-marquee');
        }

        window.addEventListener('load', setup);
        var resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(setup, 200);
        });
    })();
</script>
</body>
</html>
