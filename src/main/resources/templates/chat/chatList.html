<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>채팅 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">
</head>
<body>
<header th:replace="~{include/header :: header('chat')}"></header>

<main class="page page-medium chat-page">
    <div class="page-title">
        <h1>채팅</h1>
        <p>여행자 프로필에서 1:1 채팅을 시작할 수 있어요.</p>
    </div>

    <div class="card">
        <ul class="room-list" th:if="${not #lists.isEmpty(rooms)}">
            <li th:each="room : ${rooms}"
                th:with="other=${room.sender.memberId == session.member_id ? room.receiver : room.sender}">
                <a th:href="@{/chat/chatRoom/{id}(id=${room.roomId})}">
                    <img class="avatar"
                         th:src="${other.profileInfo != null} ? @{'/api/photo/' + ${other.profileInfo.uuid + '_' + other.profileInfo.fileName}} : @{/image/profile.png}"
                         th:attr="onerror=|this.src='@{/image/profile.png}'|" alt="">
                    <div class="room-text">
                        <strong th:text="${other.name}">이름</strong>
                        <span th:if="${other.profileInfo != null}" th:text="${other.profileInfo.travelType}">ENFP</span>
                    </div>
                    <span class="arrow">›</span>
                </a>
            </li>
        </ul>
        <div class="empty" th:if="${#lists.isEmpty(rooms)}">
            <p>아직 대화가 없어요.</p>
            <a class="btn btn-primary btn-sm" style="margin-top:16px" th:href="@{/main}">여행자 둘러보기</a>
        </div>
    </div>
</main>

<footer th:replace="~{include/footer :: footer}"></footer>
</body>
</html>
