<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat List</title>
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">
</head>

<body>
<div class="header" th:insert="~{include/header :: header}"></div>

<div class="container">
    <div>
        <p id="title">Chat Rooms</p>
    </div>

    <div class="chat_box">
        <ul id="chat_arrange">
            <li class="chat_div" th:each="room : ${rooms}" th:data-room-id="${room.roomId}">
                <div class="chat_list" th:with="other=${room.sender.memberId == session.member_id ? room.receiver : room.sender}">
                    <div class="circle" th:if="${other.profileInfo != null}">
                        <img th:class="profile" th:src="@{'/api/photo/' + ${other.profileInfo.uuid + '_' + other.profileInfo.fileName}}">
                    </div>
                    <div class="circle" th:unless="${other.profileInfo != null}">
                        <img th:class="profile" th:src="@{/image/profile.png}">
                    </div>
                    <div class="list_div">
                        <span class="name" th:text="${other.name}">username1</span>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var chatListElements = document.querySelectorAll('.chat_div');
        chatListElements.forEach(function(element) {
            element.addEventListener('click', function() {
                var roomId = element.getAttribute('data-room-id');
                if (roomId) { // roomId가 null이 아닌 경우에만 처리
                    var url = '/chat/chatRoom/' + roomId;
                    window.location.href = url;
                } else {
                    console.error("roomId is null or undefined");
                }
            });
        });
    });

</script>
</body>

</html>
