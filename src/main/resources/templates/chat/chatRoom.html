<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{include/head :: common}"></th:block>
    <title>채팅 · TRAVELMAKER</title>
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<header th:replace="~{include/header :: header('chat')}"></header>

<main class="page page-medium chat-page">
    <section class="card chat-room">
        <div class="chat-head">
            <a class="back" th:href="@{/chat/chatList}" aria-label="채팅 목록">‹</a>
            <th:block th:if="${other != null}">
                <img class="avatar"
                     th:src="${other.profileInfo != null} ? @{'/api/photo/' + ${other.profileInfo.uuid + '_' + other.profileInfo.fileName}} : @{/image/profile.svg}"
                     th:attr="onerror=|this.src='@{/image/profile.svg}'|" alt="">
                <a th:href="@{/member/otherPage/{id}(id=${other.memberId})}"><strong th:text="${other.name}">상대방</strong></a>
            </th:block>
            <strong th:unless="${other != null}">채팅</strong>
        </div>

        <div id="chat_list" class="messages"></div>

        <form id="chatForm" class="chat-input">
            <input class="input" type="text" id="chat_content" name="chat_content" maxlength="500"
                   autocomplete="off" placeholder="메시지를 입력하세요">
            <button type="submit" id="chat_btn" class="btn btn-primary">전송</button>
        </form>
    </section>
</main>

<script th:inline="javascript">
    const session_member_id = /*[[${session_member_id}]]*/ null;
    const roomId = /*[[${room_id}]]*/ null;
</script>
<script th:src="@{/js/chat/chat.js}"></script>
</body>
</html>
