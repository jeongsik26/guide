spring.application.name=guide

# Tomcat Server
server.port=${GUIDE_PORT:8888}

# HTTPS(내장 Tomcat SSL). 운영 서버는 guide.env 에서 GUIDE_SSL_ENABLED=true 와 인증서 정보를 준다
server.ssl.enabled=${GUIDE_SSL_ENABLED:false}
server.ssl.key-store=${GUIDE_SSL_KEY_STORE:file:./ssl.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${GUIDE_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-alias=${GUIDE_SSL_KEY_ALIAS:guide}
# HTTPS 일 때 세션 쿠키를 HTTPS 로만 전송
server.servlet.session.cookie.secure=${GUIDE_SSL_ENABLED:false}
server.servlet.session.cookie.http-only=true

# 기본 프로필: local(H2 파일 DB). 운영 MySQL은 --spring.profiles.active=mysql 로 실행
spring.profiles.default=local

# JPA Setting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# log Setting
logging.level.org.springframework=info
logging.level.com.guide=debug

# Picture upload Setting (기본값: 실행 위치의 upload 폴더)
com.guide.upload.path=${GUIDE_UPLOAD_PATH:./upload}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# 연관 컬렉션(이미지 등) N+1 완화
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 세션 ID를 URL(;jsessionid=)에 붙이지 않고 쿠키로만 유지
server.servlet.session.tracking-modes=cookie

# 에러 응답에 스택트레이스 노출 금지(devtools 기본값 덮어쓰기)
server.error.include-stacktrace=never
server.error.include-message=never
