# 운영 MySQL. 접속 정보는 환경변수로 주입
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${GUIDE_DB_URL:jdbc:mysql://localhost:3306/guidedb?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${GUIDE_DB_USERNAME:guide}
spring.datasource.password=${GUIDE_DB_PASSWORD:}

# 운영 로그: SQL/디버그 로그 줄이기
logging.level.com.guide=info
spring.thymeleaf.cache=true
